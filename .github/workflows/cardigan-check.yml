name: Cardigan check
run-name: cardigan/${{ inputs.card }}/${{ inputs.delivery }}/${{ inputs.attempt }}/${{ inputs.kind }}/${{ inputs.sha }}/${{ inputs.tree }}
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      tree:
        required: true
        type: string
      card:
        required: true
        type: string
      delivery:
        required: true
        type: string
      attempt:
        required: true
        type: string
      kind:
        required: true
        type: choice
        options: [merge_check, precheck]
      merge_tier:
        required: false
        type: choice
        options: [single, card, batch]
        default: single
      scope:
        required: false
        type: string
        default: full
      affected_paths:
        required: false
        type: string
        default: ''
      skip_checks:
        required: false
        type: string
        default: ''
      # C-390: candidate hc trial. Empty keeps the pinned installer version;
      # a human dispatch may name a newer hc with its archive SHA-256.
      hc_version:
        required: false
        type: string
        default: ''
      hc_sha256:
        required: false
        type: string
        default: ''
permissions:
  contents: read
# Cardigan's dispatch journal owns capacity, per-card exclusion and cancellation.
# GitHub concurrency groups can discard pending checks; do not add another queue.
jobs:
  check:
    runs-on: ubuntu-latest
    # Existing merge-gate total_timeout_minutes (default and documented config).
    timeout-minutes: 60
    steps:
      - name: Validate object inputs
        id: scope
        env:
          MERGE_TIER: ${{ inputs.merge_tier }}
          CHECK_SCOPE: ${{ inputs.scope }}
          AFFECTED_PATHS: ${{ inputs.affected_paths }}
          SKIP_CHECKS: ${{ inputs.skip_checks }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY'
          import os, re
          scope = os.environ.get('CHECK_SCOPE', 'full')
          paths = os.environ.get('AFFECTED_PATHS', '')
          skips = os.environ.get('SKIP_CHECKS', '')
          tier = os.environ.get('MERGE_TIER', 'single')
          assert tier in ('single', 'card', 'batch')
          if tier == 'batch':
              scope, paths, skips = 'full', '', ''
          valid_affected = (scope == 'affected' and not skips and 0 < len(paths) <= 4096
                            and len(paths.split(' ')) <= 64
                            and all(re.fullmatch(r'(packages|apps)/[a-z0-9-]+', p) for p in paths.split(' ')))
          valid_docs = scope == 'docs_only' and not paths and skips in ('test', 'e2e', 'test,e2e')
          if not (valid_affected or valid_docs):
              scope, paths, skips = 'full', '', ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'scope={scope}\naffected_paths={paths}\n')
              output.write(f'skip_test={str("test" in skips.split(",")).lower()}\n')
              output.write(f'skip_e2e={str(tier == "card" or "e2e" in skips.split(",")).lower()}\n')
          PY
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.sha }}
          # Compatibility tests execute source from pinned historical commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity and case scope
        id: identity
        env:
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          AFFECTED_PATHS: ${{ steps.scope.outputs.affected_paths }}
          SKIP_TEST: ${{ steps.scope.outputs.skip_test }}
          WORKFLOW_BASE: ${{ github.sha }}
          MERGE_TIER: ${{ inputs.merge_tier }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_TREE: ${{ inputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          # Only grant retries for test inputs proven independent *before* running
          # candidate code. A differing first parent (including stacked deliveries)
          # or a batch cannot establish this card's complete diff.
          cases=()
          selected() {
            [[ "$SKIP_TEST" == false && ( "$CHECK_SCOPE" == full || "$CHECK_SCOPE" == docs_only ||
               ( "$CHECK_SCOPE" == affected && " $AFFECTED_PATHS " == *" $1 "* ) ) ]]
          }
          if [[ "$MERGE_TIER" =~ ^(single|card)$ && "$WORKFLOW_BASE" =~ ^[0-9a-f]{40}$ &&
                "$(git show -s --format=%P HEAD)" =~ ^$WORKFLOW_BASE\ [0-9a-f]{40}$ ]] &&
             git diff --quiet --no-renames "$WORKFLOW_BASE" HEAD -- 'packages/host/src/check-flake-cases*' &&
             ! git diff --quiet "$WORKFLOW_BASE" HEAD; then
            diff=(git diff --quiet --no-renames "$WORKFLOW_BASE" HEAD -- . ':(exclude,glob)docs/plans/C-*.md')
            # Server fixtures cover the backend stack; UI sources are independent.
            if selected apps/server && "${diff[@]}" ':(exclude,glob)apps/web/src/**'; then cases+=(ssh_local ssh_remote loopback); fi
            # The standalone roles preload fixture doesn't run the backend or UI.
            elsewhere=()
            for pkg in apps/{web,cli,server} packages/{domain,host,mcp-server,router,store,git-service,git-transport,runtime-herdr}; do
              elsewhere+=(":(exclude,glob)$pkg/src/**")
            done
            if selected packages/roles && "${diff[@]}" "${elsewhere[@]}"; then cases+=(corepack); fi
          fi
          echo "retry_cases=${cases[*]}" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable corepack
        run: npm install --global corepack && corepack enable
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: install
        id: install
        run: pnpm install --frozen-lockfile
      # pnpm test also contains real-hc suites, so install before both test steps.
      - name: Install and verify hc
        env:
          CANDIDATE_HC_VERSION: ${{ inputs.hc_version }}
          CANDIDATE_HC_SHA256: ${{ inputs.hc_sha256 }}
        run: |
          python3 - <<'PY'
          import ast, hashlib, io, os, pathlib, platform, re, subprocess, tarfile, urllib.request
          source = ast.parse(pathlib.Path('deploy/install-agent.py').read_text())
          constants = {node.targets[0].id: ast.literal_eval(node.value)
                       for node in source.body if isinstance(node, ast.Assign)
                       and isinstance(node.targets[0], ast.Name)
                       and node.targets[0].id in ('VERSION', 'CHECKSUMS', 'DOWNLOAD_USER_AGENT')}
          version, arch = constants['VERSION'], platform.machine()
          checksum = constants['CHECKSUMS'][arch]
          candidate = os.environ.get('CANDIDATE_HC_VERSION', '')
          candidate_sha = os.environ.get('CANDIDATE_HC_SHA256', '')
          if candidate or candidate_sha:
              if not re.fullmatch(r'\d+\.\d+\.\d+', candidate) or not re.fullmatch(r'[a-f0-9]{64}', candidate_sha):
                  raise RuntimeError('candidate hc needs hc_version and its linux archive hc_sha256')
              version, checksum = candidate, candidate_sha
              print(f'candidate hc trial: {version}')
          url = f'https://releases.herdr.dev/core/{version}/herdr-core-linux-{arch}.tar.gz'
          request = urllib.request.Request(url, headers={'User-Agent': constants['DOWNLOAD_USER_AGENT']})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != checksum:
              raise RuntimeError('hc archive sha256 mismatch')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cardigan-hc'
          target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as bundle:
              member = bundle.getmember('herdr-core')
              if not member.isfile():
                  raise RuntimeError('hc archive must contain a regular binary')
              binary = target / 'hc'
              binary.write_bytes(bundle.extractfile(member).read())
          binary.chmod(0o755)
          if subprocess.check_output([str(binary), '--version'], text=True).strip() != f'hc {version}':
              raise RuntimeError('hc 缺失或版本不符')
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(target) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARDIGAN_REQUIRE_HC=1\n')
              output.write('CARDIGAN_TEST_HC=' + str(binary) + '\n')
          PY
      # Before any candidate build or unrelated suite executes, run only the
      # selected, unchanged files. Vitest workers never get a GitHub output
      # destination. The coordinator alone writes the verified result to fd 3.
      - name: Run isolated case files
        id: isolated
        env:
          CARDIGAN_CHECKED_CASES: ''
          CARDIGAN_FLAKE_CASES: ${{ steps.identity.outputs.retry_cases }}
          COREPACK_ENABLE_NETWORK: '0'
        run: |
          [[ -n "$CARDIGAN_FLAKE_CASES" ]] || exit 0
          clean=(env -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STATE)
          if [[ "$CARDIGAN_FLAKE_CASES" != corepack ]]; then "${clean[@]}" pnpm exec tsc -b; fi
          # Preserve ordinary test failure while carrying completed per-case evidence.
          status=0
          report="$("${clean[@]}" node node_modules/vitest/vitest.mjs run 3>&1 1>&2)" || status=$?
          [[ "$status" -le 1 ]] || exit "$status"
          REPORT="$report" python3 - <<'PYCODE'
          import json, os
          report = json.loads(os.environ['REPORT'])
          if not isinstance(report, dict) or set(report) != {'passed', 'recovered'} or type(report['passed']) is not bool:
              raise ValueError('invalid partition report')
          ids = report['recovered']
          allowed = os.environ['CARDIGAN_FLAKE_CASES'].split()
          if not isinstance(ids, list) or not all(key in allowed for key in ids) or len(set(ids)) != len(ids):
              raise ValueError('invalid case receipt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ids:
                  print(f'{key}=true', file=out)
          if not report['passed']:
              raise SystemExit(1)
          PYCODE
          exit "$status"
      # Fixed vocabulary only. These receipts never replace a required check.
      - name: Recovered ssh_local
        if: ${{ !cancelled() && (steps.isolated.outcome == 'success' || steps.isolated.outcome == 'failure') && contains(steps.identity.outputs.retry_cases, 'ssh_local') && steps.isolated.outputs.ssh_local == 'true' }}
        run: 'true'
      - name: Recovered ssh_remote
        if: ${{ !cancelled() && (steps.isolated.outcome == 'success' || steps.isolated.outcome == 'failure') && contains(steps.identity.outputs.retry_cases, 'ssh_remote') && steps.isolated.outputs.ssh_remote == 'true' }}
        run: 'true'
      - name: Recovered corepack
        if: ${{ !cancelled() && (steps.isolated.outcome == 'success' || steps.isolated.outcome == 'failure') && contains(steps.identity.outputs.retry_cases, 'corepack') && steps.isolated.outputs.corepack == 'true' }}
        run: 'true'
      - name: Recovered loopback
        if: ${{ !cancelled() && (steps.isolated.outcome == 'success' || steps.isolated.outcome == 'failure') && contains(steps.identity.outputs.retry_cases, 'loopback') && steps.isolated.outputs.loopback == 'true' }}
        run: 'true'
      - name: build
        id: build
        env:
          # Names the receipt a failing page-skeleton comparison prints.
          CARDIGAN_CHECK_CARD: ${{ inputs.card }}
        run: |
          pnpm build
          sh apps/web/test-support/ci-page-skeleton.sh
      - name: test
        id: test
        if: steps.scope.outputs.skip_test != 'true'
        env:
          COREPACK_ENABLE_NETWORK: '0'
          CARDIGAN_FLAKE_CASES: ''
          CARDIGAN_CHECKED_CASES: ${{ steps.identity.outputs.retry_cases }}
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          AFFECTED_PATHS: ${{ steps.scope.outputs.affected_paths }}
        run: |
          workers="$(getconf _NPROCESSORS_ONLN)"
          if [[ "$CHECK_SCOPE" == affected ]]; then
            read -r -a affected <<< "$AFFECTED_PATHS"
            pnpm --filter @cardigan/domain test:types
            pnpm exec vitest run --maxWorkers="$workers" "${affected[@]}"
          else
            pnpm test --maxWorkers="$workers"
          fi
      - name: lint
        id: lint
        run: pnpm lint
      - name: deps
        id: deps
        run: pnpm check:deps
      - name: e2e
        id: e2e
        if: steps.scope.outputs.skip_e2e != 'true'
        run: pnpm test:e2e

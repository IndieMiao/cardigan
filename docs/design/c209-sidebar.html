<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-209 · 侧栏导航设计原型</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../apps/web/src/styles.css">
<style>
  /* Standalone design fixture. No API calls, login, or product route changes. */
  body { font-family: Inter, "Noto Sans CJK SC", sans-serif; }
  .demo-content { max-width: 1100px; }
  .demo-content h1 { margin: 0; }
  .demo-subtitle { color: var(--text-muted); margin: 0 0 24px; }
  .demo-list { border-top: 1px solid var(--border); }
  .demo-row { padding: 18px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 64px 1fr 88px; gap: 16px; }
  .demo-id, .demo-state, .demo-caption { color: var(--text-muted); font-size: 13px; }
  .demo-caption { margin-top: 24px; }
  .demo-row strong { font-weight: 400; }
  .demo-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .demo-toolbar span { border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; background: var(--surface); }
  .demo-toolbar small { margin-left: auto; color: var(--text-muted); }
  .mobile-header { display: none; }
  .svg-icon { display: block; width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .after .sidebar { padding: 20px 12px 12px; gap: 24px; }
  .after .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; min-height: 28px; }
  .after .brand { font-size: 18px; font-weight: 600; }
  .after .project-switcher { margin: 0 8px; gap: 6px; }
  .after .project-switcher select { height: 36px; }
  .after .nav, .after .primary-links, .after .nav-group, .after .utility-links { display: flex; flex-direction: column; gap: 4px; }
  .after .nav { gap: 24px; }
  .after .nav-group h2 { font-size: 12px; line-height: 18px; font-weight: 400; color: var(--text-muted); margin: 0 12px 4px; }
  .after .nav-item { position: relative; display: flex; align-items: center; justify-content: flex-start; gap: 10px; min-height: 40px; padding: 10px 12px; border: 0; border-radius: 4px; background: transparent; color: var(--text); text-decoration: none; font: inherit; font-size: 14px; line-height: 20px; text-align: left; width: 100%; cursor: pointer; }
  .after .nav-item:hover { background: var(--surface-muted); }
  .after .nav-item[aria-current="page"] { color: var(--accent); background: var(--surface-muted); font-weight: 600; }
  .after .nav-item[aria-current="page"]::before { content: ""; position: absolute; width: 3px; height: 20px; left: 0; top: calc(50% - 10px); border-radius: 2px; background: var(--accent); }
  .after .needs-link { font-weight: 600; }
  .after .needs-link .svg-icon { color: var(--status-wait); }
  .after .nav-count { margin-left: auto; padding: 0 6px; min-width: 24px; height: 22px; line-height: 22px; background: var(--surface); border-radius: 4px; color: var(--status-wait); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  .after .utility-links { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
  .after .close-nav { display: none; }
  .icon-button { display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--text); cursor: pointer; }
  .icon-button:hover { background: var(--surface-muted); }
  .after :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #nav-dialog { padding: 0; margin: 0; inset: 0 auto 0 0; border: 0; width: min(280px, calc(100vw - 56px)); max-width: none; height: 100dvh; max-height: 100dvh; color: var(--text); background: var(--surface); }
  #nav-dialog::backdrop { background: var(--overlay); }
  #nav-dialog .sidebar { position: static; width: 100%; height: 100%; border-right: 1px solid var(--border); }
  .demo-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; z-index: 20; }
  .demo-toast:empty { display: none; }
  @media (prefers-color-scheme: dark) {
    /* Neutral preview only; replace this table with C-208's approved values.
       Navigation components consume existing semantic variables exclusively. */
    html[data-mode="after"] { --bg: #181818; --surface: #222222; --surface-muted: #2c2c2c; --border: #484848; --text: #d6d6d6; --text-muted: #a8a8a8; --timeline-card: #2c2c2c; }
  }
  @media (max-width: 760px) {
    .demo-row { grid-template-columns: 52px 1fr; gap: 8px; }
    .demo-state { grid-column: 2; }
    .after .app { display: block; }
    .after #desktop-nav { display: none; }
    .after .mobile-header { display: flex; height: 56px; padding: 6px 12px; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .after .mobile-header strong { font-size: 16px; }
    .after .mobile-needs { margin-left: auto; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--status-wait); text-decoration: none; min-width: 44px; min-height: 44px; padding: 0 8px; }
    .after .mobile-header .svg-icon { width: 20px; height: 20px; }
    .after .content { width: 100%; padding: 24px 16px; }
    .after .sidebar { display: flex; flex-direction: column; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); gap: 24px; overflow-y: auto; overscroll-behavior: contain; }
    .after .sidebar .nav, .after .sidebar .nav-group { display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
    .after .sidebar .nav { gap: 24px; }
    .after .nav-item { min-height: 44px; padding-block: 12px; }
    .after .brand-row { min-height: 44px; }
    .after .close-nav { display: grid; }
    .after .project-switcher select { height: 44px; }
  }
</style>
<body>
<div class="app">
  <div id="desktop-nav"></div>
  <header class="mobile-header">
    <button class="icon-button" id="open-nav" aria-label="打开导航" aria-haspopup="dialog" aria-controls="nav-dialog" aria-expanded="false"></button>
    <strong>Cardigan</strong>
    <a class="mobile-needs" href="#demo-needs-you" aria-label="Needs You，3 件待处理"></a>
  </header>
  <main class="content demo-content" id="main-content" tabindex="-1">
    <h1 id="page-heading">卡片</h1>
    <p class="demo-subtitle">查看项目进度，继续手头的工作。</p>
    <div class="demo-toolbar"><span>全部状态</span><span>按更新时间</span><small>3 张卡片</small></div>
    <div class="demo-list">
      <div class="demo-row"><span class="demo-id">C-209</span><strong>侧栏导航显示优化</strong><span class="demo-state">进行中</span></div>
      <div class="demo-row"><span class="demo-id">C-208</span><strong>暗色主题改为中性深灰</strong><span class="demo-state">进行中</span></div>
      <div class="demo-row"><span class="demo-id">C-206</span><strong>侧栏增加帮助入口</strong><span class="demo-state">进行中</span></div>
    </div>
    <p class="demo-caption">导航设计原型 · 晴雯<br>正文为示意数据；入口点击仅演示选中状态。</p>
  </main>
</div>
<dialog id="nav-dialog" aria-label="项目导航"></dialog>
<div class="demo-toast" role="status"></div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') === 'before' ? 'before' : 'after';
  document.documentElement.dataset.mode = mode;
  document.body.classList.add(mode);
  const paths = {
    inbox: '<path d="M4 4h16l2 11v5H2v-5L4 4Z"/><path d="M2 15h6l2 3h4l2-3h6"/>',
    cards: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',
    execution: '<path d="M4 20V4M4 20h16M8 15l4-6 4 4 4-8"/>',
    activity: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    decisions: '<path d="m4 7 1.5 1.5L8 6M11 7h9M4 13l1.5 1.5L8 12M11 13h9M4 19h4M11 19h9"/>',
    snapshot: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    settings: '<path d="M4 6h2m4 0h10M4 12h10m4 0h2M4 18h4m4 0h8"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 16h.01"/>',
    logout: '<path d="M10 4H4v16h6M9 12h12m-4-4 4 4-4 4"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    close: '<path d="m6 6 12 12M6 18 18 6"/>'
  };
  const icon = name => `<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
  const items = [ ['needs-you','Needs You','inbox'], ['cards','卡片','cards'], ['execution','执行视图','execution'], ['activity','项目动态','activity'], ['decision-history','拍板记录','decisions'], ['snapshot','项目快照','snapshot'], ['settings','设置','settings'], ['help','帮助','help'] ];
  const countFixture = new URLSearchParams(location.search).get('count');
  const count = countFixture==='0' ? 0 : countFixture==='128' ? 128 : 3;
  const link = ([key,label,glyph]) => `<a class="nav-item ${key==='needs-you'?'needs-link':''}" href="#demo-${key}" ${key==='cards'?'aria-current="page"':''}>${mode==='after'?icon(glyph):''}<span>${label}</span>${key==='needs-you'&&count>0?`<span class="nav-count" aria-label="${count} 件待处理">${count}</span>`:''}</a>`;
  const project = '<label class="project-switcher"><span>项目</span><select aria-label="项目"><option>Cardigan</option></select></label>';
  const sidebar = document.createElement('aside');
  sidebar.className='sidebar'; sidebar.setAttribute('aria-label','Workbench 导航');
  if (mode==='before') {
    sidebar.innerHTML=`<span class="brand">Cardigan</span>${project}<nav class="nav" aria-label="视图">${link(items[0])}<div class="nav-group"><h2>工作</h2>${link(items[1])}</div><div class="nav-group"><h2>运行</h2>${items.slice(2,6).map(link).join('')}</div><div class="nav-group"><h2>项目</h2>${link(items[6])}</div></nav><div class="sidebar-footer"><button class="logout">登出</button></div>`;
  } else {
    sidebar.innerHTML=`<div class="brand-row"><span class="brand">Cardigan</span><button class="icon-button close-nav" aria-label="关闭导航">${icon('close')}</button></div>${project}<nav class="nav" aria-label="视图"><div class="primary-links">${items.slice(0,2).map(link).join('')}</div><div class="nav-group"><h2>项目</h2>${items.slice(2,6).map(link).join('')}</div></nav><nav class="utility-links" aria-label="工具">${items.slice(6).map(link).join('')}<button class="nav-item logout">${icon('logout')}<span>登出</span></button></nav>`;
  }
  document.querySelector('#desktop-nav').append(sidebar);
  const dialog=document.querySelector('#nav-dialog'), opener=document.querySelector('#open-nav');
  opener.innerHTML=icon('menu');
  document.querySelector('.mobile-needs').innerHTML=icon('inbox')+(count>0?`<span>${count}</span>`:'');
  document.querySelector('.mobile-needs').setAttribute('aria-label',`Needs You，${count} 件待处理`);
  let restoreFocus=true;
  function closeNav(restore=true) { restoreFocus=restore; dialog.close(); }
  opener.onclick=()=>{ dialog.append(sidebar); dialog.showModal(); document.body.style.overflow='hidden'; opener.setAttribute('aria-expanded','true'); sidebar.querySelector('.close-nav').focus(); };
  dialog.addEventListener('close',()=>{ document.querySelector('#desktop-nav').append(sidebar); document.body.style.overflow=''; opener.setAttribute('aria-expanded','false'); if(restoreFocus) opener.focus(); else document.querySelector('#main-content').focus(); restoreFocus=true; });
  dialog.addEventListener('cancel',()=>{restoreFocus=true;});
  dialog.addEventListener('click',event=>{ if(event.target===dialog) {const rect=dialog.getBoundingClientRect(); if(event.clientX>rect.right || event.clientY>rect.bottom) closeNav();} });
  sidebar.querySelector('.close-nav')?.addEventListener('click',()=>closeNav());
  matchMedia('(max-width: 760px)').addEventListener('change',event=>{if(!event.matches && dialog.open) closeNav(false);});
  let toastTimer;
  document.addEventListener('click',event=>{
    const target=event.target.closest('a[href^="#demo-"]');
    if(target){ event.preventDefault(); const key=target.getAttribute('href').slice(6); sidebar.querySelectorAll('a').forEach(a=>{if(a.getAttribute('href')===target.getAttribute('href')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');}); document.querySelector('#page-heading').textContent=items.find(i=>i[0]===key)[1]; if(dialog.open) closeNav(false); }
    if(event.target.closest('.logout')) { const toast=document.querySelector('.demo-toast'); toast.textContent='原型演示：登出沿用现有流程'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.textContent='',2500); }
  });
</script>
</body>
</html>
